# Continuous deployment: one Cloud Build trigger runs this file on every push to main (infra/gcp/README.md, "Continuous
# deployment from GitHub"). It builds the five images from the repo root, pushes them to Artifact Registry tagged with the
# commit, then hands the deploy to scripts/deploy-gcp.sh --skip-build, so every service's flags, env, secrets and order
# stay in that one script. The script runs no migrations: they go first, from your laptop (the schema step refuses
# otherwise).
#
# Region, repository and image names below must equal the script's (REGION, REPO, image()); so must the core-api origin
# baked into web (url core-api). infra/gcp/test/cloudbuild-deploy.test.py checks both against the script.
# Cloud Build substitutes every $NAME in this file: shell variables are written $$NAME.
steps:
  # Refuse before any build minute is spent. A trigger fills a missing substitution with "" rather than failing.
  - id: check
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["TAG=$SHORT_SHA", "TENANT=${_DEMO_TENANT_ID}"]
    args:
      - -c
      - |
        [ -n "$$TAG" ] || { echo "cloudbuild-deploy: no commit (SHORT_SHA is empty). Run this file from the trigger, not gcloud builds submit." >&2; exit 1; }
        [[ "$$TENANT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$$ ]] || {
          echo "cloudbuild-deploy: the trigger's _DEMO_TENANT_ID must be the tenant id the seed printed (got '$$TENANT')." >&2; exit 1; }
        echo "cloudbuild-deploy: commit $$TAG, demo tenant $$TENANT"

  # The four images that take no build arguments. DOCKER_BUILDKIT=1 is what applies each Dockerfile's own
  # <name>.Dockerfile.dockerignore allowlist.
  - id: build-intel
    name: gcr.io/cloud-builders/docker
    waitFor: [check]
    env: ["DOCKER_BUILDKIT=1"]
    args: [build, -f, infra/gcp/docker/intel.Dockerfile, -t, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/intel:$SHORT_SHA", .]
  - id: build-suppliers-sim
    name: gcr.io/cloud-builders/docker
    waitFor: [check]
    env: ["DOCKER_BUILDKIT=1"]
    args: [build, -f, infra/gcp/docker/suppliers-sim.Dockerfile, -t, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/suppliers-sim:$SHORT_SHA", .]
  - id: build-core-api
    name: gcr.io/cloud-builders/docker
    waitFor: [check]
    env: ["DOCKER_BUILDKIT=1"]
    args: [build, -f, infra/gcp/docker/core-api.Dockerfile, -t, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-api:$SHORT_SHA", .]
  # After core-api, not beside it: the two build stages are identical, so this one is a cache hit.
  - id: build-core-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-core-api]
    env: ["DOCKER_BUILDKIT=1"]
    args: [build, -f, infra/gcp/docker/core-worker.Dockerfile, -t, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-worker:$SHORT_SHA", .]

  # web, as infra/gcp/cloudbuild-web.yaml builds it: Next fixes core-api's origin and the storefront key (public by design,
  # it ships to browsers) at build time. The key is read from Secret Manager, so a reseed's new version is picked up.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: [check]
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["STOREFRONT_KEY"]
    args:
      - -c
      - |
        [ -n "$$STOREFRONT_KEY" ] || { echo "cloudbuild-deploy: secret munim-storefront-key is empty" >&2; exit 1; }
        docker build -f infra/gcp/docker/web.Dockerfile \
          --build-arg=MUNIM_API_ORIGIN=https://munim-core-api-$PROJECT_NUMBER.asia-south1.run.app \
          --build-arg=NEXT_PUBLIC_MUNIM_STOREFRONT_KEY="$$STOREFRONT_KEY" \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/munim/web:$SHORT_SHA .

  # Pushed here, not by `images:` below: Cloud Build pushes `images:` only after the last step, and the deploy needs them.
  - id: push-intel
    name: gcr.io/cloud-builders/docker
    waitFor: [build-intel]
    args: [push, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/intel:$SHORT_SHA"]
  - id: push-suppliers-sim
    name: gcr.io/cloud-builders/docker
    waitFor: [build-suppliers-sim]
    args: [push, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/suppliers-sim:$SHORT_SHA"]
  - id: push-core-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-core-api]
    args: [push, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-api:$SHORT_SHA"]
  - id: push-core-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-core-worker]
    args: [push, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-worker:$SHORT_SHA"]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args: [push, "asia-south1-docker.pkg.dev/$PROJECT_ID/munim/web:$SHORT_SHA"]

  # The database must already hold every migration this commit carries: core-api does not check at boot, so code ahead of
  # its schema would fail on the first query that needs the new migration. Reads the public /health of the running core-api,
  # after the pushes, so a refusal leaves the images in Artifact Registry for a deploy by hand once the database is migrated.
  - id: schema
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-intel, push-suppliers-sim, push-core-api, push-core-worker, push-web]
    entrypoint: bash
    args:
      - -c
      - |
        want=$$(ls db/migrations | sed -n 's/^\([0-9]\{4\}\)_.*\.sql$$/\1/p' | sort | tail -n 1)
        [ -n "$$want" ] || { echo "cloudbuild-deploy: no migrations found under db/migrations" >&2; exit 1; }
        want=$$((10#$$want))
        have=$$(curl -sS --max-time 20 https://munim-core-api-$PROJECT_NUMBER.asia-south1.run.app/health | sed -n 's/.*"migration_version":\([0-9]*\).*/\1/p')
        [ -n "$$have" ] || { echo "cloudbuild-deploy: core-api /health gave no migration version, so the schema cannot be checked. Images are pushed; deploy by hand: scripts/deploy-gcp.sh --project $PROJECT_ID --tag $SHORT_SHA --skip-build" >&2; exit 1; }
        [ "$$have" -ge "$$want" ] || { echo "cloudbuild-deploy: the database is at migration $$have, this commit needs $$want. Run node db/migrate.ts from your laptop (infra/gcp/README.md, deploy step 1), then run the trigger again or deploy these images: scripts/deploy-gcp.sh --project $PROJECT_ID --tag $SHORT_SHA --skip-build" >&2; exit 1; }
        echo "cloudbuild-deploy: database at migration $$have, commit needs $$want"

  # The deploy: the same script and order as a laptop run, with images that already exist. The demo tenant goes to web.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [schema]
    entrypoint: bash
    env: ["CLOUDSDK_CORE_DISABLE_PROMPTS=1", "MUNIM_DEMO_TENANT_ID=${_DEMO_TENANT_ID}"]
    args: [scripts/deploy-gcp.sh, --project, $PROJECT_ID, --tag, $SHORT_SHA, --skip-build]

# Listed for the build record (each image's digest); already pushed above.
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/munim/intel:$SHORT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/munim/suppliers-sim:$SHORT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-api:$SHORT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/munim/core-worker:$SHORT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/munim/web:$SHORT_SHA

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/munim-storefront-key/versions/latest
      env: STOREFRONT_KEY

# Set on the trigger (README). Empty here so a trigger without it is refused by the check step, not deployed.
substitutions:
  _DEMO_TENANT_ID: ""

# 8 vCPU so the parallel builds do not queue; 40 minutes caps a stuck build's cost. CLOUD_LOGGING_ONLY is required when the
# trigger runs as its own service account (munim-deploy).
timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
