# Munim Intelligence (03-architecture §1.1): Python 3.12 + Google ADK, no Postgres write path (R25).
# R36: google-adk pinned exactly; NO litellm, never the [eval] / [extensions] / [all] / [test] extras —
# tests/test_lockfile.py fails on either. openai is ADK's own [openai] range (OpenAILlm needs it).
[project]
name = "munim-intel"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "google-adk==2.11.0",
  "a2a-sdk==1.2.2",
  "openai>=2.20,<3",
  "cryptography",
  "fastapi",
  "httpx",
  "pydantic",
  "uvicorn",
]

[dependency-groups]
# munim-suppliers-sim: the negotiation tests drive the simulated suppliers in-process (tests/negotiate/kit.py); without it
# a clean checkout (CI) cannot import them. Dev only: the deployed intel never imports another service.
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "a2a-sdk[http-server]==1.2.2", "munim-suppliers-sim"]

[tool.uv.sources]
munim-suppliers-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["munim_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["fixture_miss_expected: the test proves a degrade path by missing a recorded fixture on purpose (tests/conftest.py)"]

# ruff + mypy (`make lint` / `make typecheck`) cover the areas listed here. An area joins when its lane makes it
# pass; contracts_gen is generated and never checked.
[tool.ruff]
line-length = 140
target-version = "py312"
# Explicit names: ruff's `*` also matches `/`.
include = [
  "munim_intel/__init__.py", "munim_intel/__main__.py", "munim_intel/app.py", "munim_intel/asgi.py", "munim_intel/config.py", "munim_intel/smoke.py",
  "munim_intel/runtime/**/*.py", "munim_intel/llm/**/*.py", "munim_intel/tools/**/*.py",
  "munim_intel/decide/**/*.py", "munim_intel/trace/**/*.py",
  "munim_intel/watch/**/*.py", "munim_intel/detect/**/*.py", "munim_intel/narrate/**/*.py", "munim_intel/mapping/**/*.py", "munim_intel/events/**/*.py",
  "munim_intel/skills/**/*.py", "munim_intel/context/**/*.py",
  "munim_intel/ingest/**/*.py", "munim_intel/negotiate/**/*.py", "munim_intel/graph/**/*.py",
  "munim_intel/manager/**/*.py", "tests/manager/*.py",
  "munim_intel/fanout/**/*.py", "tests/fanout/*.py",
  "munim_intel/wiki/**/*.py", "tests/wiki/*.py",
  "munim_intel/brief/**/*.py", "tests/brief/*.py",
  "munim_intel/investigate/**/*.py", "tests/investigate/*.py",
  "tests/ingest/*.py", "tests/negotiate/*.py", "tests/graph/*.py", "tests/context/*.py",
  "tests/watch/test_watch.py", "tests/watch/test_watch_e2e.py", "tests/watch/stack.py", "tests/watch/make_fixtures.py",
  "tests/watch/test_hooks.py", "tests/watch/test_frame_source.py", "tests/packs/**/*.py",
  "tests/decide/*.py", "tests/tools/*.py", "tests/trace/trace_harness.py", "tests/trace/trace_record.py", "tests/trace/test_trace_plugin.py",
  "tests/trace/test_trace_core_roundtrip.py", "tests/trace/test_spend.py",
  "tests/conftest.py", "tests/test_app.py", "tests/test_asgi.py", "tests/test_config.py", "tests/test_internal_client.py", "tests/test_lockfile.py",
  "tests/test_models.py", "tests/test_recorded.py", "tests/test_runtoken.py", "tests/test_smoke.py", "tests/test_tools.py",
  "tests/test_fixture_guard.py",
  "tests/fixtures/smoke_once.py", "tests/live/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
# assert is how pytest asserts; subprocess calls in tests run fixed argv lists of our own tools.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106", "S603"], "tests/tools/test_generated.py" = ["S101", "S105", "S106", "S603", "E501"], "munim_intel/runtime/internal_client.py" = ["S101", "S105"] }

[tool.ruff.lint.isort]
# graph_world / bridge (tests/graph) and kit (tests/negotiate) are imported by bare name from their own directory.
known-first-party = ["munim_intel", "conftest", "graph_world", "bridge", "kit", "manager_kit", "fanout_kit"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "munim_intel/__init__.py", "munim_intel/__main__.py", "munim_intel/app.py", "munim_intel/asgi.py", "munim_intel/config.py", "munim_intel/smoke.py",
  "munim_intel/runtime", "munim_intel/llm", "munim_intel/tools", "munim_intel/decide", "munim_intel/trace", "munim_intel/watch", "munim_intel/detect", "munim_intel/narrate", "munim_intel/mapping", "munim_intel/events",
  "munim_intel/skills", "munim_intel/context",
  "munim_intel/ingest", "munim_intel/negotiate", "munim_intel/graph",
  "munim_intel/manager", "tests/manager",
  "munim_intel/fanout", "tests/fanout",
  "munim_intel/wiki", "tests/wiki",
  "munim_intel/brief", "tests/brief",
  "munim_intel/investigate", "tests/investigate",
  "tests/ingest", "tests/negotiate", "tests/graph", "tests/context",
  "tests/watch/test_watch.py", "tests/watch/test_watch_e2e.py", "tests/watch/stack.py", "tests/watch/make_fixtures.py",
  "tests/watch/test_hooks.py", "tests/watch/test_frame_source.py", "tests/packs",
  "tests/decide", "tests/tools", "tests/trace/trace_harness.py", "tests/trace/trace_record.py", "tests/trace/test_trace_plugin.py",
  "tests/trace/test_trace_core_roundtrip.py", "tests/trace/test_spend.py",
  "tests/conftest.py", "tests/test_app.py", "tests/test_asgi.py", "tests/test_config.py", "tests/test_internal_client.py", "tests/test_lockfile.py",
  "tests/test_models.py", "tests/test_recorded.py", "tests/test_runtoken.py", "tests/test_smoke.py", "tests/test_tools.py",
  "tests/test_fixture_guard.py",
  "tests/fixtures/smoke_once.py", "tests/live",
]
mypy_path = "tests"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["munim_intel.contracts_gen.*"]
follow_imports = "silent"
